name: release

# Push a tag like v0.1.1 to publish. There is no npm token: npm trusts this workflow through GitHub's
# OIDC token (trusted publishing, set on the package's settings page on npmjs.com — see RELEASING.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: This npm can publish through OIDC
        run: |
          v="$(npm --version)"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a * 1e6 + b * 1e3 + c < 11005001) { console.error(`npm ${process.argv[1]} is older than 11.5.1`); process.exit(1) }' "$v" \
            || { echo "::error::npm $v cannot use trusted publishing; it needs 11.5.1 or newer"; exit 1; }
      - run: npm test
      - name: The tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: npm publish
        env:
          # Empty on purpose. npm swaps in a short-lived token from the OIDC exchange; if npm has no
          # trusted publisher for this workflow, publishing stops with ENEEDAUTH instead of using a
          # stale token.
          NODE_AUTH_TOKEN: ""
        run: |
          set -o pipefail
          logs="$RUNNER_TEMP/npm-logs"
          if npm publish --provenance --access public --logs-dir "$logs" 2>&1 | tee "$RUNNER_TEMP/publish.out"; then
            exit 0
          fi
          # npm only writes why trusted publishing failed to its debug log. Lift that, and npm's own
          # error, into an annotation so the reason is on the run page.
          oidc=$( { grep -h -E '^[0-9]+ (verbose|silly) oidc ' "$logs"/*.log 2>/dev/null || true; } | sed -E 's/^[0-9]+ [a-z]+ oidc //' | tail -n 3)
          err=$( { grep -E '^npm error (code |[0-9]{3} )' "$RUNNER_TEMP/publish.out" || true; } | head -n 3)
          msg=$(printf 'trusted publishing: %s | npm: %s' "${oidc:-nothing logged}" "${err:-no error line}" | tr '\n\r' '  ' | sed -e 's/%/%25/g')
          echo "::error title=npm publish failed::$msg"
          exit 1
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Move the major tag the Action is used by
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major"
          git push -f origin "$major"
