name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/sourcetruth.mjs --demo -o demo.html

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: map
        uses: ./
        with:
          path: examples/solidity-vault
          min-resolution: 90
          output: vault-map.html
      - name: The example vault has exactly one blind spot
        run: test "${{ steps.map.outputs.blind-spots }}" = "1"
