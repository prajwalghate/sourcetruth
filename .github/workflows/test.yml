name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/sourcetruth.mjs --demo -o demo.html

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Look like a caller that names npm but has no lockfile
        run: npm pkg set packageManager=npm@11.19.0 && test ! -e package-lock.json
      - id: map
        uses: ./
        with:
          path: examples/solidity-vault
          min-resolution: 90
          output: vault-map.html
      - name: The example vault has exactly one blind spot
        run: test "${{ steps.map.outputs.blind-spots }}" = "1"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # the release job's Node, so the same npm
      - name: package.json publishes as written
        # A dry run against an unreachable registry: nothing is uploaded, but npm still reports every
        # field it would have to rewrite.
        run: |
          out=$(npm publish --dry-run --registry http://127.0.0.1:9 2>&1) || { printf '%s\n' "$out"; exit 1; }
          if printf '%s\n' "$out" | grep -q 'auto-corrected'; then
            printf '%s\n' "$out" | grep 'npm warn publish'
            echo "::error::npm would rewrite package.json on publish. Run 'npm pkg fix' and keep what it changes."
            exit 1
          fi
